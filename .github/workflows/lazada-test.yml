name: Lazada API test

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Optional categoryL1 ID to filter the feed"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run connection test
        env:
          # Either three separate secrets...
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          # ...or one GREATDEALS secret containing KEY=VALUE lines.
          GREATDEALS_BUNDLE: ${{ secrets.GREATDEALS }}
          TEST_CATEGORY: ${{ inputs.category }}
        run: python scripts/lazada_test.py
